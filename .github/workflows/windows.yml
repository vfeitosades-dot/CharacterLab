name: Build Windows
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'assets/character.glb'
      - 'main.gd'
      - 'project.godot'
      - '.github/workflows/windows.yml'
permissions:
  contents: write
jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check model
        run: test -s assets/character.glb
      - name: Install Godot and templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          mv Godot_v4.4.1-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
          unzip -q Godot_v4.4.1-stable_export_templates.tpz -d /tmp/godot_templates
          mkdir -p ~/.local/share/godot/export_templates
          mv /tmp/godot_templates/templates ~/.local/share/godot/export_templates/4.4.1.stable
          rm Godot_v4.4.1-stable_linux.x86_64.zip Godot_v4.4.1-stable_export_templates.tpz
      - name: Import and export
        run: |
          mkdir -p build
          /tmp/godot --headless --editor --path . --import
          /tmp/godot --headless --path . --export-release 'Windows Desktop' build/CharacterLab.exe
          test -s build/CharacterLab.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CharacterLab-Windows
          path: build/CharacterLab.exe
      - name: Publish direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view windows-latest >/dev/null 2>&1; then
            gh release upload windows-latest build/CharacterLab.exe --clobber
          else
            gh release create windows-latest build/CharacterLab.exe --title 'Character Lab Windows' --notes 'Windows x64 standalone build.'
          fi
