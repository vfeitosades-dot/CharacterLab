name: Build Windows
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'CharacterLab_Godot.zip'
      - 'assets/character.glb'
      - 'main.gd'
      - 'project.godot'
      - '.github/workflows/windows.yml'
permissions:
  contents: write
jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        run: |
          if [ -f CharacterLab_Godot.zip ]; then
            unzip -q CharacterLab_Godot.zip -d "$RUNNER_TEMP/characterlab"
            project="$RUNNER_TEMP/characterlab/CharacterLab_Godot"
          else
            project="$GITHUB_WORKSPACE"
          fi
          test -s "$project/assets/character.glb" || { echo "::error::Upload CharacterLab_Godot.zip to the repository root."; exit 1; }
          test -s "$project/project.godot"
          echo "PROJECT_DIR=$project" >> "$GITHUB_ENV"
      - name: Install Godot and templates
        run: |
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          curl -fL --retry 3 -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q godot.zip
          mv Godot_v4.4.1-stable_linux.x86_64 godot
          chmod +x godot
          unzip -q templates.tpz -d godot_templates
          mkdir -p ~/.local/share/godot/export_templates
          mv godot_templates/templates ~/.local/share/godot/export_templates/4.4.1.stable
      - name: Import and export
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          "$RUNNER_TEMP/godot" --headless --editor --path "$PROJECT_DIR" --import
          "$RUNNER_TEMP/godot" --headless --path "$PROJECT_DIR" --export-release "Windows Desktop" "$GITHUB_WORKSPACE/build/CharacterLab.exe"
          test -s "$GITHUB_WORKSPACE/build/CharacterLab.exe"
          file "$GITHUB_WORKSPACE/build/CharacterLab.exe" | grep -E 'PE32'
      - uses: actions/upload-artifact@v4
        with:
          name: CharacterLab-Windows
          path: build/CharacterLab.exe
          if-no-files-found: error
      - name: Publish direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view windows-latest >/dev/null 2>&1; then
            gh release upload windows-latest build/CharacterLab.exe --clobber
          else
            gh release create windows-latest build/CharacterLab.exe --title 'Character Lab Windows' --notes 'Windows x64 standalone build.'
          fi
