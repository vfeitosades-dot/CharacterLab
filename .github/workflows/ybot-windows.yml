name: Y Bot Windows
on:
  push:
    branches: [ybot-baseplate]
    paths: ['YBot-Godot.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: |
          test -s YBot-Godot.zip
          unzip -q YBot-Godot.zip -d "$RUNNER_TEMP/ybot"
      - name: Install Godot 4.4.1
        run: |
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          curl -fL --retry 3 -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q godot.zip
          mv Godot_v4.4.1-stable_linux.x86_64 godot
          chmod +x godot
          unzip -q templates.tpz -d godot_templates
          mkdir -p ~/.local/share/godot/export_templates
          mv godot_templates/templates ~/.local/share/godot/export_templates/4.4.1.stable
      - name: Import and verify animations
        run: |
          "$RUNNER_TEMP/godot" --headless --editor --path "$RUNNER_TEMP/ybot" --import
          timeout 60 "$RUNNER_TEMP/godot" --headless --path "$RUNNER_TEMP/ybot" -- --smoke-test
      - name: Export Windows x64
        run: |
          mkdir -p build
          "$RUNNER_TEMP/godot" --headless --path "$RUNNER_TEMP/ybot" --export-release 'Windows Desktop' "$GITHUB_WORKSPACE/build/YBot.exe"
          test -s build/YBot.exe
          file build/YBot.exe | grep PE32
      - uses: actions/upload-artifact@v4
        with:
          name: YBot-Windows
          path: build/YBot.exe
          if-no-files-found: error
      - name: Publish executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ybot-windows >/dev/null 2>&1; then
            gh release upload ybot-windows build/YBot.exe --clobber
          else
            gh release create ybot-windows build/YBot.exe --target "$GITHUB_SHA" --title 'Y Bot - Baseplate (Windows)' --notes 'Windows x64. Executable with embedded game data.'
          fi
