name: Y Bot V12 - Natural Movement Windows
on:
  push:
    branches: [ybot-baseplate]
    paths: ['v12/**','.github/workflows/ybot-graphics-v12.yml']
  workflow_dispatch:
concurrency:
  group: ybot-graphics-v12
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ybot-baseplate
      - name: Restore only original FBX animations
        run: |
          mkdir -p project build
          unzip -q YBot-Motifect-V3.zip -d project
          rm -rf project/assets/motion project/motifect.gd project/MOTIFECT_LICENSE.txt project/.github
          cp v9/movement.gd project/movement.gd
          cp v7/cinematic.gd project/cinematic.gd
          cp v11/pool.gd project/pool.gd
          cp v12/graphics.gd project/natural.gd
          mkdir -p project/visual
          cp v6/*.gdshader project/visual/
          cp v10/*.gdshader project/visual/
          cp v11/*.gdshader project/visual/
          sed -i 's#res://motifect.gd#res://natural.gd#' project/main.tscn
          sed -i 's#include_filter=.*#include_filter=""#' project/export_presets.cfg
          python - <<'PY'
          from pathlib import Path
          p=Path("project/project.godot")
          s=p.read_text()
          if "[physics]" in s:
              s=s.replace("[physics]","[physics]\ncommon/physics_interpolation=true",1)
          else:
              s+="\n[physics]\ncommon/physics_interpolation=true\n"
          p.write_text(s)
          PY
          cd project/assets
          sha256sum -c <<'HASHES'
          5c6d9a3adb3c9b1772532cfbe48d4e72db7db3be9f6d5ffa475a8a10798c415e  jump.fbx
          945e76b0e32f889fcd546dcfb730e25095c0b704c986ed7db54f748c54b524a8  run_jump.fbx
          cb5843e0dbee6c17885d2aff77dcc1c52c9715d6657cf185b155cc4241996f1b  run.fbx
          bdd6482bbec1917b2a9693d2a5d3ac18b9b70a4450f63169f6320e2b96932a6b  walk.fbx
          HASHES
          test -s idle.fbx
          test -s ybot.fbx
          cd ..
          printf '%s\n' '# Y Bot V12 - Natural Movement' 'Original Mixamo idle, walk, run, jump and running jump. WASD, Shift, Space, mouse. Continuous curves, synchronized walking and running steps, interpolation, original animations, Esc settings.' > README.md
          zip -qr ../build/YBot-Graphics-V12.zip . -x '.godot/*'
      - name: Install Godot
        run: |
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          curl -fL --retry 3 -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q godot.zip
          mv Godot_v4.4.1-stable_linux.x86_64 godot
          chmod +x godot
          unzip -q templates.tpz -d godot_templates
          mkdir -p ~/.local/share/godot/export_templates
          mv godot_templates/templates ~/.local/share/godot/export_templates/4.4.1.stable
      - name: Import and smoke test
        run: |
          "$RUNNER_TEMP/godot" --headless --editor --path "$GITHUB_WORKSPACE/project" --import
          set -o pipefail
          timeout 120 "$RUNNER_TEMP/godot" --headless --path "$GITHUB_WORKSPACE/project" -- --smoke-test 2>&1 | tee build/smoke.log
          if grep -E "SCRIPT ERROR|Shader compilation failed|Parse Error" build/smoke.log; then exit 1; fi
          rm build/smoke.log
      - name: Export Windows
        run: |
          "$RUNNER_TEMP/godot" --headless --path "$GITHUB_WORKSPACE/project" --export-release "Windows Desktop" "$GITHUB_WORKSPACE/build/YBot-Graphics-V12.exe"
          test -s build/YBot-Graphics-V12.exe
          file build/YBot-Graphics-V12.exe | grep PE32
          mv build/YBot-Graphics-V12.exe build/YBot-Graphics-V12-Leve.exe
          python - <<'PY'
          from pathlib import Path
          p=Path("project/project.godot")
          s=p.read_text()
          lines=[line for line in s.splitlines() if not line.startswith(("renderer/rendering_method=", "renderer/rendering_method.mobile=", "lights_and_shadows/directional_shadow/size="))]
          s="\n".join(lines).replace('"GL Compatibility"','"Forward Plus"')
          if "[rendering]" not in s:
              s+="\n[rendering]\n"
          s=s.replace("[rendering]",'[rendering]\nrenderer/rendering_method="forward_plus"\nlights_and_shadows/directional_shadow/size=8192',1)
          p.write_text(s+"\n")
          PY
          "$RUNNER_TEMP/godot" --headless --editor --path "$GITHUB_WORKSPACE/project" --import
          "$RUNNER_TEMP/godot" --headless --path "$GITHUB_WORKSPACE/project" --export-release "Windows Desktop" "$GITHUB_WORKSPACE/build/YBot-Graphics-V12-Ultra.exe"
          test -s build/YBot-Graphics-V12-Ultra.exe
          file build/YBot-Graphics-V12-Ultra.exe | grep PE32
      - uses: actions/upload-artifact@v4
        with:
          name: YBot-Graphics-V12
          path: build/*
          if-no-files-found: error
      - name: Publish ZIP and EXE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view ybot-graphics-v12 >/dev/null 2>&1; then
            gh release create ybot-graphics-v12 --target "$(git rev-parse HEAD)" --title 'Y Bot V12 - Natural Movement' --notes 'Compatibility and Forward+ executables. Ultra includes optional SDFGI, SSAO, SSIL, SSR, TAA and soft sunlight. No hardware ray tracing.'
          fi
          for attempt in 1 2 3; do
            if gh release upload ybot-graphics-v12 build/YBot-Graphics-V12-Leve.exe build/YBot-Graphics-V12-Ultra.exe build/YBot-Graphics-V12.zip --clobber; then exit 0; fi
            sleep 5
          done
          echo "::warning::Release upload failed; use the verified Actions artifact."
          exit 0
